name: iOS App Store release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-ipa:
    name: Build signed App Store IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare native iOS project
        run: node scripts/ios-prepare.mjs

      - name: Import signing certificate and provisioning profile
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          readonly BUNDLE_ID="no.strandeconsulting.sleepy"
          readonly KEYCHAIN_PATH="$RUNNER_TEMP/SleepyBuild.keychain-db"
          readonly CERTIFICATE_PATH="$RUNNER_TEMP/SleepyDistribution.p12"
          readonly PROFILE_PATH="$RUNNER_TEMP/SleepyAppStore.mobileprovision"
          readonly PROFILE_PLIST="$RUNNER_TEMP/SleepyAppStore.plist"
          readonly PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          readonly KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          mkdir -p "$PROFILE_DIRECTORY"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" -o "$PROFILE_PLIST"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          ENTITLEMENT_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$PROFILE_PLIST")"

          test -n "$PROFILE_NAME"
          test -n "$PROFILE_UUID"
          test -n "$TEAM_ID"
          test "$ENTITLEMENT_TEAM_ID" = "$TEAM_ID"
          test "$APPLICATION_IDENTIFIER" = "$TEAM_ID.$BUNDLE_ID"

          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"
          printf 'Provisioning profile name: %s\n' "$PROFILE_NAME"
          printf 'Provisioning profile UUID: %s\n' "$PROFILE_UUID"
          printf 'Provisioning profile TeamIdentifier: %s\n' "$TEAM_ID"
          printf 'Provisioning profile application-identifier: %s\n' "$APPLICATION_IDENTIFIER"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' '/Apple Distribution/ { print $2; exit }')"
          test -n "$SIGNING_IDENTITY"
          printf 'Apple Distribution signing identity is available.\n'

          {
            printf 'SLEEPY_PROFILE_UUID=%s\n' "$PROFILE_UUID"
            printf 'SLEEPY_PROFILE_NAME=%s\n' "$PROFILE_NAME"
            printf 'SLEEPY_TEAM_ID=%s\n' "$TEAM_ID"
            printf 'SLEEPY_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Set release build number
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_RUN_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "GITHUB_RUN_NUMBER must be numeric" >&2
            exit 1
          fi

          printf 'Marketing version: 1.0\n'
          printf 'Build number: %s\n' "$GITHUB_RUN_NUMBER"
          printf 'SLEEPY_BUILD_NUMBER=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Archive signed iOS application
        shell: bash
        run: |
          set -euo pipefail

          readonly BUNDLE_ID="no.strandeconsulting.sleepy"
          readonly KEYCHAIN_PATH="$RUNNER_TEMP/SleepyBuild.keychain-db"
          readonly ARCHIVE_PATH="$RUNNER_TEMP/Sleepy.xcarchive"

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            SLEEPY_DEVELOPMENT_TEAM="$SLEEPY_TEAM_ID" \
            SLEEPY_CODE_SIGN_IDENTITY="$SLEEPY_SIGNING_IDENTITY" \
            SLEEPY_PROVISIONING_PROFILE_SPECIFIER="$SLEEPY_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$SLEEPY_BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

          test -d "$ARCHIVE_PATH"
          readonly ARCHIVE_APP_PATH="$ARCHIVE_PATH/Products/Applications/App.app"
          readonly ARCHIVE_INFO_PLIST="$ARCHIVE_APP_PATH/Info.plist"
          test -d "$ARCHIVE_APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ARCHIVE_INFO_PLIST")" = "no.strandeconsulting.sleepy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$ARCHIVE_INFO_PLIST")" = "1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVE_INFO_PLIST")" = "$SLEEPY_BUILD_NUMBER"
          printf 'Archive version: 1.0\n'
          printf 'Archive build number: %s\n' "$SLEEPY_BUILD_NUMBER"

      - name: Create App Store export options
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>no.strandeconsulting.sleepy</key>
              <string>${SLEEPY_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${SLEEPY_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export signed App Store IPA
        shell: bash
        run: |
          set -euo pipefail

          readonly ARCHIVE_PATH="$RUNNER_TEMP/Sleepy.xcarchive"
          readonly EXPORT_PATH="$RUNNER_TEMP/SleepyExport"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_PATH"

      - name: Verify signed IPA
        shell: bash
        run: |
          set -euo pipefail

          readonly BUNDLE_ID="no.strandeconsulting.sleepy"
          readonly EXPORT_PATH="$RUNNER_TEMP/SleepyExport"
          readonly IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          readonly IPA_ROOT="$RUNNER_TEMP/SleepyIPAPayload"

          test -n "$IPA_PATH"
          test -f "$IPA_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT"
          unzip -q "$IPA_PATH" -d "$IPA_ROOT"

          readonly APP_PATH="$IPA_ROOT/Payload/App.app"
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$SLEEPY_BUILD_NUMBER"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          SIGNING_SUMMARY="$(codesign -dvvv "$APP_PATH" 2>&1 \
            | grep -E 'Identifier=|TeamIdentifier=|Authority=Apple Distribution' || true)"
          test -n "$SIGNING_SUMMARY"
          printf '%s\n' "$SIGNING_SUMMARY"
          printf 'IPA version: 1.0\n'
          printf 'IPA build number: %s\n' "$SLEEPY_BUILD_NUMBER"
          printf 'Verified signed IPA: %s\n' "$(basename "$IPA_PATH")"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleepy-AppStore-IPA
          path: ${{ runner.temp }}/SleepyExport/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          readonly IPA_PATH="$(find "$RUNNER_TEMP/SleepyExport" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          readonly PRIVATE_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          readonly PRIVATE_KEY_PATH="$PRIVATE_KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          test -n "$IPA_PATH"
          test -f "$IPA_PATH"
          mkdir -p "$PRIVATE_KEY_DIRECTORY"
          umask 077
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$PRIVATE_KEY_PATH"
          test -s "$PRIVATE_KEY_PATH"
          chmod 600 "$PRIVATE_KEY_PATH"
          printf 'SLEEPY_ASC_PRIVATE_KEY_PATH=%s\n' "$PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up signing materials
        if: always()
        shell: bash
        run: |
          set +e
          KEYCHAIN_PATH="$RUNNER_TEMP/SleepyBuild.keychain-db"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          if [ -n "${SLEEPY_PROFILE_UUID:-}" ]; then
            rm -f "$PROFILE_DIRECTORY/$SLEEPY_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/SleepyDistribution.p12"
          rm -f "$RUNNER_TEMP/SleepyAppStore.mobileprovision"
          rm -f "$RUNNER_TEMP/SleepyAppStore.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${SLEEPY_ASC_PRIVATE_KEY_PATH:-}" ]; then
            rm -f "$SLEEPY_ASC_PRIVATE_KEY_PATH"
          fi
