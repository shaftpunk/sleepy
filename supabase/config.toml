
[functions.send-push]
enabled = true
verify_jwt = false
import_map = "./functions/send-push/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-push/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-push/*.html" ]

[functions.send-native-push]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-native-push/index.ts"

[functions.check-feeding-reminders]
enabled = true
verify_jwt = false
import_map = "./functions/check-feeding-reminders/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/check-feeding-reminders/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/check-feeding-reminders/*.html" ]

[functions.sleep-notify]
enabled = true
# Invoked only by the sleep table's database trigger (via pg_net), which
# has no Supabase Auth JWT to present. Authorization instead comes from the
# x-sleepy-webhook-secret header, checked inside the function itself.
verify_jwt = false
import_map = "./functions/sleep-notify/deno.json"
entrypoint = "./functions/sleep-notify/index.ts"

[functions.family-message]
enabled = true
# This endpoint is called by signed-in app users. It also verifies the caller
# in its own code before using the service role for recipient lookup.
verify_jwt = true
import_map = "./functions/family-message/deno.json"
entrypoint = "./functions/family-message/index.ts"

[functions.sound-monitor-status]
enabled = true
# Issue: Supabase Auth + caller RLS. Validate: scoped HMAC capability, not Auth JWT.
verify_jwt = false
entrypoint = "./functions/sound-monitor-status/index.ts"
[functions.subscription-reconcile]
enabled = true
# JWT verified by auth.getUser in the handler; supports current Supabase JWT keys.
verify_jwt = false
entrypoint = "./functions/subscription-reconcile/index.ts"

[functions.subscription-maintenance]
enabled = true
verify_jwt = false
entrypoint = "./functions/subscription-maintenance/index.ts"

[functions.revenuecat-webhook]
enabled = true
# RevenueCat's configured Authorization secret is checked before parsing payloads.
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"
